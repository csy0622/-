# ------------------------------------------------------------
# 模型
# ------------------------------------------------------------
models:
  default:
    provider: deepseek
    id: deepseek-flash        # 2026-10-11 实测：API 返回的 id 就是 deepseek-flash（显示名 DeepSeek-V4.1-Flash）
    input: [text, image]      # 实测支持图片，已用日报截图验证可读出表格细节
    context_window: 1048576
    max_output_tokens: 393216
    register_via: assistant/pi-agent/models.json   # 已在 <agent-dir>/models.json 注册
  text_only:
    provider: deepseek
    id: deepseek-v4-pro       # 纯文本，input_modalities 只有 text
  # 结论：主模型本身支持图片，**不需要单独注册一个视觉模型**，复盘读图不需要切模型。

# ------------------------------------------------------------
# 板块异动扫描口径（日报 b 块 / M6）
# ------------------------------------------------------------
# 口径可切换：sw1（申万一级 31 个，默认）/ em（东财行业板块）/ etf（仅清单内 ETF 的跟踪指数）
# 实测：申万一级 28/31 个 ≥12.6 年；石油石化/环保/美容护理 3 个仅 4.8 年（2021-12 才拆出）
sectors:
  mode: sw1
  threshold_pct: 2.0            # 涨跌幅绝对值超过该值算异动
  data_cutoff: prev_close       # 09:00 生成日报，故异动/要闻/偏离均取上一交易日收盘
  source: 申万宏源行业指数        # 经 akshare index_hist_sw，symbol 用裸代码（801010，不能带 .SI）
  new_since_2021: ["801960 石油石化", "801970 环保", "801980 美容护理"]

# ------------------------------------------------------------
# 日报与调度
# ------------------------------------------------------------
report:
  daily:
    generate_at: "09:00"
    theme: light                # 白色系
    sections: [article, news_moves, opportunities, baseline]   # a / b / c / d
    push_feishu: false          # 2026-10-11 定：不推飞书，只在电脑上看本地 HTML
  article_fetch_at: "11:30"     # 猫笔刀抓取时点

# ------------------------------------------------------------
# 文章源
# ------------------------------------------------------------
articles:
  - channel: 微信公众号
    account: 猫笔刀
    fetch_via: 浏览器登录态（mp.weixin.qq.com）
    schedule: 每日 11:30
    dedupe_key: 发布日期 + 标题
