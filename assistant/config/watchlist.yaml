# ------------------------------------------------------------
# 基线（每个标的各自一条冻结线性线）
# ------------------------------------------------------------
# 口径（沿用《IC_增长拟合与对照分析》与 ic_backtest/configs/settings.yaml）：
#   点位 ≈ value_at_base + slope × (年份小数 − base_year)
# 参数在设计时写死、**不随新数据重拟合** —— 因此是时间的常函数，不含逐日前视。
# slope 与 r2 由首次拟合产出后冻结；r2 用于在日报中如实说明拟合质量。
# 2026-10-11 定：ETF 基线与指数基线**都要** ——
#   ETF 基线答「我买的这只贵不贵」，指数基线答「这个板块贵不贵」（指数历史更长，更稳）。
baseline:
  base_year: 2014
  risk_zone_pct: 0.20            # 高于基线该比例，视为进入高风险区间
  fit_on: 年末收盘               # 拟合输入；后续可增加「日线收盘」口径做对照

  # 期指与宽基（基线挂在标的指数上，见技术方案决策 H）
  items:
    - { code: "000905", name: 中证500,         value_at_base: 5660.0, slope: 73.0, r2: 0.06, status: 已冻结（来自既有分析） }
    - { code: "IC",     name: 中证500股指期货,  value_at_base: 5660.0, slope: 73.0, r2: 0.06, status: 已冻结（同其标的 000905） }
    - { code: "000300", name: 沪深300,         value_at_base: 3123.26, slope: 122.9132, r2: 0.421, status: 已冻结（2026-10-12 实测拟合） }

