# ============================================================
# 投资助手 3.0 — 投资偏好（手工录入，随时可改）
# ============================================================
# 用途：日报 (c) 块「行业机会与值得关注」的筛选口径、以及对话中的建议基线。
# 这是「我想要的」；持仓实际是什么在 holdings.json，两者分开记。
# ============================================================

version: 1
updated: "2026-10-11"

# ------------------------------------------------------------
# 目标
# ------------------------------------------------------------
objective:
  风格: 求稳
  收益目标: 稳定拿到 5%+          # 当前诉求
  后续目标: 可能提到 7%            # 尚未开始追，先记录
  风险容忍: 接受适度回撤，希望长期盈利
  # 【待确认】「适度回撤」的具体上限未定（PRD 里默认按 30% 走，需你确认）

# ------------------------------------------------------------
# 配置意向（目标比例，非当前实盘）
# ------------------------------------------------------------
target_allocation:
  - bucket: 黄金 + 美金 QDII
    weight: 0.20
    note: 对冲与外币敞口；**注意：这两类尚未纳入数据与基线清单**
  - bucket: 高分红股票
    weight: 0.30
    note: 如美的、银行等；**注意：个股不纳入数据/基线/回测，只作偏好记录**
  - bucket: 股指期货
    weight: 0.50
    leverage: 1.5
    strategy: 吃贴水（滚 IC/IF）
    note: 与既有 icbt 回测口径一致；1.5 倍杠杆需要在回测里显式建模保证金占用

# ------------------------------------------------------------
# 对数据层的要求（由上面的配置推导出来的缺口）
# ------------------------------------------------------------
data_gaps:
  status: 待 Carl 决定 黄金/QDII 是否纳入数据层
  items:
    - 黄金：不在清单，若要在日报里看黄金位置，需补 黄金ETF 518880 与其跟踪标的
    - 美金 QDII：不在清单，需明确是哪只（如 纳指/标普/美元债 QDII）
    - 高分红个股：按已定口径「个股不做」，仅在偏好里记录，不进数据链路

# ------------------------------------------------------------
# 其他约束
# ------------------------------------------------------------
constraints:
  日报推送: 不推飞书（只在电脑上看本地 HTML）
  建议形式: 只做解读与观察提示，不给下单指令
